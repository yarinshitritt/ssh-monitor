<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
  <link rel="stylesheet" href="style.css">
  <title>SSH Monitor</title>
</head>
<body>
  <header class="app-header">
    <div>
      <h1>SSH Monitor</h1>
      <p class="subtitle">Browser SSH terminal with live connection monitoring</p>
    </div>
    <div id="status" class="status">not connected</div>
  </header>

  <main class="layout">
    <!-- Login form, hidden while connected -->
    <form id="login-form" class="card">
      <h2>Connect to a server</h2>
      <div class="fields">
        <label>Server address
          <input type="text" id="host" placeholder="server address" value="localhost" required>
        </label>
        <label>Port
          <input type="number" id="port" placeholder="port" value="22" required>
        </label>
        <label>Username
          <input type="text" id="username" placeholder="username" required>
        </label>
        <label>Password
          <input type="password" id="password" placeholder="password" required>
        </label>
      </div>
      <button type="submit">Connect</button>
    </form>

    <section class="card">
      <div class="card-title">Terminal</div>
      <div id="terminal"></div>
    </section>

    <!-- Updated every second from the server's metrics messages -->
    <section class="card">
      <div class="card-title">Connection monitor</div>
      <div id="metrics" class="metrics">
        <div class="metric"><span class="label">Connection state</span><span id="m-state" class="value">-</span></div>
        <div class="metric"><span class="label">Server</span><span id="m-remote" class="value">-</span></div>
        <div class="metric"><span class="label">Received</span><span id="m-in" class="value">-</span></div>
        <div class="metric"><span class="label">Sent</span><span id="m-out" class="value">-</span></div>
        <div class="metric"><span class="label">Receive rate</span><span id="m-rate-in" class="value">-</span></div>
        <div class="metric"><span class="label">Send rate</span><span id="m-rate-out" class="value">-</span></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
  <script src="app.js"></script>
</body>
</html>
